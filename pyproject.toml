[project]
name = "pymetalink"
version = "0.0.1"
description = "A metalink library for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Neil McNab", email = "nabber00@gmail.com" }, { name = "Bram Neijt", email = "bram@neijt.nl" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Repository = "https://github.com/metalink-dev/pymetalink"

[project.scripts]
pymetalink = "metalink.console:main"

[dependency-groups]
dev = ["prek>=0.5.2", "pyftpdlib>=2.0", "pytest>=8.2.2", "ruff>=0.4.0", "twine>=5.1.1"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [".eggs", ".git", ".pyenv", ".ruff_cache", "build", "dist", "venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# The following ignores should be removed when the following issues are fixed:
ignore = [
  "E402",  # Module level import not at top of file
  "E722",  # Do not use bare 'except'
  "E741",  # Ambiguous variable name 'l'
  "F403",  # 'from module import *' used; unable to detect undefined names
  "F821"  # Undefined name
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.uv.build-backend]
module-name = "metalink"
